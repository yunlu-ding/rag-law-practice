# nginx 反向代理配置模板
#
# 用法：
#   sudo cp vibe-rag.nginx.conf /etc/nginx/sites-available/vibe-rag
#   sudo ln -s /etc/nginx/sites-available/vibe-rag /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 注意：这是模板，本地没有 nginx 无法验证。改完务必先跑 nginx -t。

server {
    listen 80;
    # 换成你的域名；如果还没备案、要用 IP 访问，就写服务器公网 IP
    server_name your-domain.com;

    # 上传教材类 PDF 可能上百 MB，默认的 1M 会直接返回 413
    client_max_body_size 200M;

    # 问答最长可能几十秒（检索 + 重排 + 生成），超时要放宽。
    # 默认 60s 大致够用，但留足余量比上线后才发现被截断要好。
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 这一行是限额能生效的关键：应用需要拿到真实客户端 IP。
        # 不加的话，所有请求看起来都来自 127.0.0.1，
        # 单 IP 限额会退化成"全局限额"，一个人就能把所有人挡在外面。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
